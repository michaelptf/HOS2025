<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOS2025 Available Units Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              ink: {
                50: "#f8fafc",
                100: "#eef2ff",
                200: "#dbe4ff",
                300: "#c0cdff",
                700: "#24325c",
                800: "#1b2545",
                900: "#0f172a"
              },
              mint: {
                100: "#dbfff4",
                200: "#a5f3dc",
                500: "#10b981",
                700: "#047857"
              }
            },
            boxShadow: {
              panel: "0 10px 30px rgba(15, 23, 42, 0.12)"
            }
          }
        }
      };
    </script>

    
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="h-full bg-slate-100 text-slate-900 dark:bg-ink-900 dark:text-slate-100">
    <div class="relative min-h-full overflow-hidden">
      <div class="pointer-events-none absolute inset-0 opacity-80">
        <div class="absolute -top-40 left-1/2 h-[32rem] w-[32rem] -translate-x-1/2 rounded-full bg-gradient-to-r from-cyan-300/60 to-mint-200/70 blur-3xl dark:from-cyan-500/20 dark:to-mint-500/20"></div>
        <div class="absolute bottom-0 right-0 h-72 w-72 rounded-full bg-gradient-to-br from-amber-200/60 to-rose-200/40 blur-3xl dark:from-amber-500/10 dark:to-rose-500/10"></div>
      </div>

      <div class="relative mx-auto max-w-7xl px-3 py-3 sm:px-6 lg:px-8 lg:py-6">
        <header class="mb-4 rounded-3xl bg-white p-4 shadow-panel backdrop-blur-md dark:bg-ink-800/88">
          <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
            <div>
              <p class="text-[11px] font-bold tracking-[0.18em] text-cyan-700 dark:text-cyan-300">HOS 2025 AVAILABLE UNITS</p>
              <h1 id="app-title" class="mt-1 text-xl font-black tracking-tight text-ink-900 sm:text-2xl dark:text-slate-100">居屋2025 可選單位追蹤器</h1>
              <p class="mt-1 text-sm font-semibold text-slate-800 dark:text-slate-100">Home Ownership Scheme 2025 Available Units Tracker</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <span id="last-updated" class="rounded-full bg-cyan-50 px-3 py-1 text-xs font-bold text-cyan-900 shadow-sm dark:bg-cyan-900/30 dark:text-cyan-100">最後更新：載入中...</span>
              <button id="filter-toggle" class="inline-flex items-center rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-800 shadow-sm hover:bg-slate-50 md:hidden dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700">篩選</button>
              <button id="theme-toggle" class="rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-800 shadow-sm hover:bg-slate-50 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700">深淺色</button>
            </div>
          </div>
        </header>

        <div class="grid grid-cols-1 gap-4 md:grid-cols-12">
          <aside
            id="filters-panel"
            class="
              fixed inset-y-0 left-0 z-40 hidden
              w-full
              overflow-y-auto

              bg-slate-200
              p-4 shadow-2xl

              md:sticky md:top-4
              md:col-span-4
              md:block
              md:h-[calc(100vh-2rem)]
              md:rounded-3xl
              md:bg-slate-200
              md:w-auto
              md:max-w-none

              lg:col-span-3

              dark:bg-ink-800
            "
          >
            <div class="mb-3 flex items-center justify-between">
              <h2 class="text-base font-extrabold text-slate-900 dark:text-slate-100">篩選條件</h2>
              <button id="filters-close" class="rounded-lg bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-700 shadow-sm md:hidden dark:bg-slate-700 dark:text-slate-100">關閉</button>
            </div>

            <div class="space-y-3">
              <!-- <label class="block">
                <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">快速搜尋</span>
                <input id="filter-search" type="text" placeholder="例如: 03 或 20樓" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700" />
              </label> -->

              <div class="grid grid-cols-2 gap-2">
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">屋苑（可多選）</span>
                  <select id="filter-estate" multiple size="5" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700"></select>
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">主座數</span>
                  <select id="filter-block" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700"></select>
                </label>
              </div>

              <label class="block">
                <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">座數（可多選）</span>
                <select id="filter-blocks" multiple size="5" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700"></select>
              </label>

              <div class="grid grid-cols-2 gap-2">
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">面積呎（最小）</span>
                  <input id="filter-sqft-min" type="number" min="0" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700" />
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">面積呎（最大）</span>
                  <input id="filter-sqft-max" type="number" min="0" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700" />
                </label>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">最低樓層</span>
                  <input id="filter-floor-min" type="number" min="0" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700" />
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">最高樓層</span>
                  <input id="filter-floor-max" type="number" min="0" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700" />
                </label>
              </div>

              <!-- <div class="grid grid-cols-2 gap-2">
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">面積㎡（最小）</span>
                  <input id="filter-sqm-min" type="number" min="0" step="0.1" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700" />
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">面積㎡（最大）</span>
                  <input id="filter-sqm-max" type="number" min="0" step="0.1" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700" />
                </label>
              </div> -->

              <div class="grid grid-cols-2 gap-2">
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">價格（最小）</span>
                  <input id="filter-price-min" type="number" min="0" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700" />
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">價格（最大）</span>
                  <input id="filter-price-max" type="number" min="0" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700" />
                </label>
              </div>

              <!-- <div class="grid grid-cols-2 gap-2">
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">座向</span>
                  <select id="filter-orientation" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700"></select>
                </label>
                <label class="block">
                  <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">戶型</span>
                  <select id="filter-unit-type" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700"></select>
                </label>
              </div> -->

              <label class="block">
                <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">顯示狀態</span>
                <select id="filter-availability" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700">
                  <option value="all">全部</option>
                  <option value="available">只顯示可選</option>
                  <option value="unavailable">只顯示不可選</option>
                </select>
              </label>

              <label class="block">
                <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-800 dark:text-slate-100">排序</span>
                <select id="filter-sort" class="w-full rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm outline-none transition focus:ring-2 focus:ring-cyan-300 dark:bg-slate-900 dark:text-slate-100 dark:focus:ring-cyan-700">
                  <option value="floor:desc">樓層（高至低）</option>
                  <option value="floor:asc">樓層（低至高）</option>
                  <option value="saleableAreaSqft:desc">面積呎（大至小）</option>
                  <option value="saleableAreaSqft:asc">面積呎（小至大）</option>
                  <option value="priceHkd:desc">價格（高至低）</option>
                  <option value="priceHkd:asc">價格（低至高）</option>
                </select>
              </label>

              <button id="filters-reset" class="w-full rounded-xl bg-slate-100 px-3 py-2 text-sm font-semibold text-slate-800 shadow-sm hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-100 dark:hover:bg-slate-600">重設篩選</button>
              <button id="filters-apply" class="w-full rounded-xl bg-cyan-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-cyan-700 md:hidden">套用篩選並關閉</button>
            </div>
          </aside>

          <main class="md:col-span-8 lg:col-span-9">
            <section class="rounded-3xl bg-white p-4 shadow-panel backdrop-blur dark:bg-ink-800/90">
            <div class="mb-3 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <p id="result-count" class="text-sm font-semibold text-slate-700 dark:text-slate-200">可選 0 / 總數 0</p>
                <p class="text-xs text-slate-600 dark:text-slate-300">點選屋苑與座數切換單位狀態圖，點擊格子查看詳情</p>
              </div>
              <div class="legend-row">
                <span class="legend-item"><span class="legend-dot legend-dot-available"></span> 可選單位</span>
                <span class="legend-item"><span class="legend-dot legend-dot-unavailable"></span> 不可選單位</span>
              </div>
            </div>

            <div id="loading-state" class="hidden rounded-xl bg-slate-100/80 p-6 text-center text-sm font-semibold text-slate-700 shadow-sm dark:bg-slate-800/80 dark:text-slate-200">正在載入單位資料...</div>
            <div id="empty-state" class="hidden rounded-xl bg-slate-100/80 p-6 text-center text-sm font-semibold text-slate-700 shadow-sm dark:bg-slate-800/80 dark:text-slate-200">暫時沒有單位資料。</div>

            <div id="estate-tabs" class="tab-row mb-3"></div>
            <div id="block-tabs" class="tab-row mb-3"></div>

            <div class="overflow-x-auto rounded-xl bg-white/80 p-2 shadow-sm dark:bg-slate-900/40">
              <table class="availability-grid min-w-full text-sm">
                <thead id="grid-head"></thead>
                <tbody id="grid-body"></tbody>
              </table>
            </div>

            <div class="mt-4 rounded-2xl bg-slate-50/80 p-3 shadow-sm dark:bg-slate-900/40">
              <div class="mb-2 flex items-center justify-between">
                <h3 class="text-sm font-extrabold text-slate-900 dark:text-slate-100">符合篩選單位</h3>
                <p id="matches-count" class="text-xs font-bold text-slate-700 dark:text-slate-200">0 筆</p>
              </div>
              <div id="matches-list" class="grid grid-cols-1 gap-2 sm:grid-cols-2"></div>
            </div>
          </section>
          </main>
        </div>
      </div>

      <div id="unit-modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 px-4 py-8">
        <div class="mx-auto mt-8 w-full max-w-md rounded-2xl bg-white p-4 shadow-panel dark:bg-ink-800">
          <div class="mb-2 flex items-center justify-between">
            <h2 class="text-base font-bold">單位詳情</h2>
            <button id="modal-close" class="rounded-lg border border-slate-300 px-2 py-1 text-xs font-semibold">關閉</button>
          </div>
          <div id="modal-content" class="text-sm text-slate-700 dark:text-slate-200"></div>
        </div>
      </div>
    </div>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
